<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { gold: '#c9a227' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>html,body{width:390px;height:844px;margin:0;overflow:hidden}</style>
</head>
<body class="flex h-[844px] w-[390px] flex-col bg-[#f5f5f5] font-sans text-black antialiased">
  <header class="shrink-0 bg-black text-white">
    <div class="flex h-14 items-center gap-2 px-3">
      <span class="text-lg font-black">‹</span>
      <img src="../../src/frontend/public/logo.png" alt="" class="h-9 w-9 object-contain" />
      <div class="leading-tight">
        <p class="text-[13px] font-black uppercase tracking-wide">JO15-1 invullen</p>
        <p class="text-[10px] font-semibold uppercase tracking-wider text-neutral-300">Za 3 okt · VV Krimpen</p>
      </div>
    </div>
    <div class="h-1 bg-gold"></div>
  </header>

  <main class="min-h-0 flex-1 space-y-2 overflow-hidden px-3 pb-2 pt-3">
    <div class="rounded-md bg-black px-3 py-2 text-white">
      <p class="text-[11px] font-bold uppercase tracking-wide text-gold">Nu deze dienst</p>
      <p class="text-lg font-black leading-tight">Bar 12:00 – 16:30</p>
      <p class="text-xs text-neutral-300">Nog 2 ouders · tik twee namen</p>
    </div>

    <button class="flex w-full items-center gap-3 rounded-md border-2 border-black bg-white p-3 text-left">
      <span class="flex h-7 w-7 items-center justify-center rounded-full bg-black text-xs font-black text-white">1</span>
      <span class="min-w-0 flex-1">
        <span class="block font-black leading-tight">Ouder Jansen</span>
        <span class="block text-xs text-neutral-500">0× gestaan · geen app-account</span>
      </span>
      <span class="text-[10px] font-black uppercase">Gekozen</span>
    </button>

    <button class="flex w-full items-center gap-3 rounded-md border-2 border-black bg-white p-3 text-left">
      <span class="flex h-7 w-7 items-center justify-center rounded-full bg-black text-xs font-black text-white">2</span>
      <span class="min-w-0 flex-1">
        <span class="block font-black leading-tight">Nieuwe Ouder</span>
        <span class="block text-xs text-neutral-500">0× gestaan · geen app-account</span>
      </span>
      <span class="text-[10px] font-black uppercase">Gekozen</span>
    </button>

    <button class="flex w-full items-center gap-3 rounded-md border border-[#cccccc] bg-white p-3 text-left opacity-80">
      <span class="h-7 w-7 rounded-full border-2 border-[#cccccc]"></span>
      <span class="min-w-0 flex-1">
        <span class="block font-black leading-tight">Tom van Dam</span>
        <span class="block text-xs text-neutral-500">0× teamdienst · heeft wel een account</span>
      </span>
    </button>

    <button class="flex w-full items-center gap-3 rounded-md border border-[#cccccc] bg-white p-3 text-left opacity-80">
      <span class="h-7 w-7 rounded-full border-2 border-[#cccccc]"></span>
      <span class="min-w-0 flex-1">
        <span class="block font-black leading-tight">Lisa Bakker</span>
        <span class="block text-xs text-neutral-500">0× team · staat al op persoonlijke bar</span>
      </span>
    </button>

    <div class="rounded-md border border-[#cccccc] bg-white px-3 py-2 text-xs text-neutral-700">
      Daarna nog <strong>1 plek</strong> op bar 16:30 – 19:30. Peter en Fatima horen bij JO13, niet bij deze dienst.
    </div>
  </main>

  <div class="shrink-0 border-t border-[#cccccc] bg-white px-3 py-2">
    <button class="h-12 w-full rounded-full bg-black text-sm font-black uppercase tracking-wide text-white">Zet 2 ouders op 12:00</button>
  </div>
</body>
</html>
