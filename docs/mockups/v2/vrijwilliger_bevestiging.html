<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>html,body{width:390px;height:844px;margin:0;overflow:hidden}</style>
</head>
<body class="flex h-[844px] w-[390px] flex-col bg-[#f5f5f5] font-sans text-black antialiased">
  <header class="shrink-0 bg-black text-white">
    <div class="flex h-12 items-center gap-2 px-4">
      <img src="../../../src/frontend/public/logo.png" alt="" class="h-8 w-8 object-contain" />
      <p class="text-sm font-black uppercase tracking-wide">V.V. Lekkerkerk</p>
    </div>
    <div class="h-1 bg-[#c9a227]"></div>
  </header>

  <main class="flex min-h-0 flex-1 flex-col items-center px-6 pb-6 pt-16 text-center">
    <div class="flex h-28 w-28 items-center justify-center rounded-full bg-[#c9a227]">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4"><path d="M5 12.5 10 17.5 19 7"/></svg>
    </div>
    <p class="mt-8 text-[40px] font-black leading-none">Zondag 27 sep</p>
    <p class="mt-3 text-3xl font-semibold">13:00 – 16:00</p>
    <div class="mt-auto w-full">
      <button class="h-16 w-full rounded-full bg-black text-xl font-black text-white">Klaar</button>
    </div>
  </main>
</body>
</html>
