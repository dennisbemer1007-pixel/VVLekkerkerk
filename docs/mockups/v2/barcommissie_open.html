<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>html,body{width:390px;height:844px;margin:0;overflow:hidden}</style>
</head>
<body class="flex h-[844px] w-[390px] flex-col bg-[#f5f5f5] font-sans text-black antialiased">
  <header class="shrink-0 bg-black text-white">
    <div class="flex h-12 items-center gap-2 px-4">
      <img src="../../../src/frontend/public/logo.png" alt="" class="h-8 w-8 object-contain" />
      <p class="text-sm font-black uppercase tracking-wide">V.V. Lekkerkerk</p>
    </div>
    <div class="h-1 bg-[#c9a227]"></div>
  </header>

  <main class="flex min-h-0 flex-1 flex-col gap-3 px-4 pb-4 pt-5">
    <h1 class="text-[32px] font-black leading-none">Open</h1>

    <article class="rounded-lg bg-white p-4 shadow-sm">
      <p class="text-xl font-black leading-tight">Zondag 27 sep</p>
      <p class="text-lg font-semibold">13:00 – 16:00</p>
      <button class="mt-3 h-14 w-full rounded-full bg-black text-lg font-black text-white">Wijs toe</button>
    </article>

    <article class="rounded-lg bg-white p-4 shadow-sm">
      <p class="text-xl font-black leading-tight">Dinsdag 29 sep</p>
      <p class="text-lg font-semibold">19:00 – 22:00</p>
      <button class="mt-3 h-14 w-full rounded-full bg-black text-lg font-black text-white">Wijs toe</button>
    </article>

    <article class="rounded-lg bg-white p-4 shadow-sm">
      <p class="text-xl font-black leading-tight">Zaterdag 3 okt</p>
      <p class="text-lg font-semibold">10:00 – 13:00</p>
      <button class="mt-3 h-14 w-full rounded-full bg-black text-lg font-black text-white">Wijs toe</button>
    </article>
  </main>
</body>
</html>
