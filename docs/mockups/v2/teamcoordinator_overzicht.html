<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>html,body{width:390px;height:844px;margin:0;overflow:hidden}</style>
</head>
<body class="flex h-[844px] w-[390px] flex-col bg-[#f5f5f5] font-sans text-black antialiased">
  <header class="shrink-0 bg-black text-white">
    <div class="flex h-12 items-center gap-2 px-4">
      <img src="../../../src/frontend/public/logo.png" alt="" class="h-8 w-8 object-contain" />
      <p class="text-sm font-black uppercase tracking-wide">V.V. Lekkerkerk</p>
    </div>
    <div class="h-1 bg-[#c9a227]"></div>
  </header>

  <main class="flex min-h-0 flex-1 flex-col gap-4 px-4 pb-4 pt-6">
    <h1 class="text-[32px] font-black leading-none">Invullen</h1>

    <article class="flex flex-1 flex-col justify-between rounded-lg bg-white p-5 shadow-sm">
      <div>
        <p class="text-[28px] font-black leading-none">Za 3 okt</p>
        <p class="mt-2 text-xl font-semibold">JO15-1</p>
        <p class="mt-1 text-lg">3 ouders</p>
      </div>
      <button class="mt-4 h-16 w-full rounded-full bg-black text-xl font-black text-white">Invullen</button>
    </article>

    <article class="flex flex-1 flex-col justify-between rounded-lg bg-white p-5 shadow-sm">
      <div>
        <p class="text-[28px] font-black leading-none">Za 10 okt</p>
        <p class="mt-2 text-xl font-semibold">JO13-2</p>
        <p class="mt-1 text-lg">3 ouders</p>
      </div>
      <button class="mt-4 h-16 w-full rounded-full bg-black text-xl font-black text-white">Invullen</button>
    </article>
  </main>
</body>
</html>
