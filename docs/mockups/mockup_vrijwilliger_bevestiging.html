<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { gold: '#c9a227' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>html,body{width:390px;height:844px;margin:0;overflow:hidden}</style>
</head>
<body class="flex h-[844px] w-[390px] flex-col bg-[#f5f5f5] font-sans text-black antialiased">
  <header class="shrink-0 bg-black text-white">
    <div class="flex h-14 items-center justify-between px-3">
      <div class="flex items-center gap-2">
        <img src="../../src/frontend/public/logo.png" alt="" class="h-10 w-10 object-contain" />
        <div class="leading-tight">
          <p class="text-[13px] font-black uppercase tracking-wide">V.V. Lekkerkerk</p>
          <p class="text-[10px] font-semibold uppercase tracking-wider text-neutral-300">Vrijwilliger</p>
        </div>
      </div>
      <p class="text-sm font-bold">Lisa</p>
    </div>
    <div class="h-1 bg-gold"></div>
  </header>

  <main class="flex min-h-0 flex-1 flex-col px-4 pb-4 pt-8">
    <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-gold text-black">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.5 10 17l9-10"/></svg>
    </div>
    <h1 class="mt-5 text-center text-[28px] font-black leading-none tracking-tight">Je staat erop</h1>
    <p class="mt-2 text-center text-sm text-neutral-600">Lisa Bakker is ingeschreven. Meer stappen zijn er niet.</p>

    <section class="mt-6 rounded-md border border-[#cccccc] bg-white p-4 shadow-sm">
      <p class="text-[11px] font-black uppercase tracking-wide text-neutral-500">Jouw dienst</p>
      <p class="mt-1 text-xl font-black leading-tight">Zondag 27 september</p>
      <p class="mt-1 text-base font-semibold">Bar · 13:00 – 16:00</p>
      <p class="text-sm text-neutral-600">Clubhuis V.V. Lekkerkerk</p>
      <div class="mt-3 flex items-center justify-between border-t border-[#cccccc] pt-3 text-sm">
        <span>Bezetting</span>
        <span class="font-black">1 van 1 · vol</span>
      </div>
      <p class="mt-2 text-xs text-neutral-500">Herinnering: de dag ervoor, als e-mail aanstaat.</p>
    </section>

    <div class="mt-auto space-y-2">
      <button class="h-12 w-full rounded-full bg-black text-sm font-black uppercase tracking-wide text-white">Naar mijn diensten</button>
      <button class="h-12 w-full rounded-full border-2 border-black bg-white text-sm font-black uppercase tracking-wide">Toch afmelden</button>
    </div>
  </main>
</body>
</html>
