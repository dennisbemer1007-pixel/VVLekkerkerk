<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { gold: '#c9a227' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <style>html,body{width:390px;height:844px;margin:0;overflow:hidden}</style>
</head>
<body class="flex h-[844px] w-[390px] flex-col bg-[#f5f5f5] font-sans text-black antialiased">
  <header class="shrink-0 bg-black text-white">
    <div class="flex h-14 items-center justify-between px-3">
      <div class="flex items-center gap-2">
        <img src="../../src/frontend/public/logo.png" alt="" class="h-10 w-10 object-contain" />
        <div class="leading-tight">
          <p class="text-[13px] font-black uppercase tracking-wide">V.V. Lekkerkerk</p>
          <p class="text-[10px] font-semibold uppercase tracking-wider text-neutral-300">Vrijwilliger</p>
        </div>
      </div>
      <p class="text-sm font-bold">Lisa</p>
    </div>
    <div class="h-1 bg-gold"></div>
  </header>

  <main class="min-h-0 flex-1 space-y-2.5 overflow-hidden px-3 pb-2 pt-3">
    <div>
      <h1 class="text-xl font-black leading-none">Ruilen</h1>
      <p class="mt-1 text-xs text-neutral-600">Kies jouw dienst en die van een ander. Die persoon zegt ja of nee.</p>
    </div>

    <p class="text-[11px] font-black uppercase tracking-wide text-neutral-500">1 · Jouw dienst</p>
    <button class="flex w-full items-center gap-3 rounded-md border-2 border-black bg-white p-3 text-left">
      <span class="flex h-6 w-6 items-center justify-center rounded-full bg-black text-white">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5 10 17l9-10"/></svg>
      </span>
      <span>
        <span class="block text-sm font-black">Zo 27 sep · bar 09:00 – 13:00</span>
        <span class="block text-xs text-neutral-500">Jij staat hier</span>
      </span>
    </button>
    <button class="w-full rounded-md border border-[#cccccc] bg-white px-3 py-2 text-left text-xs font-semibold text-neutral-600">
      Of kies keuken vandaag 12:00 – 15:00
    </button>

    <p class="text-[11px] font-black uppercase tracking-wide text-neutral-500">2 · Ruilen met</p>

    <button class="flex w-full items-center gap-3 rounded-md border-2 border-gold bg-white p-3 text-left">
      <span class="flex h-6 w-6 items-center justify-center rounded-full bg-gold text-[11px] font-black">2</span>
      <span class="min-w-0 flex-1">
        <span class="block text-sm font-black">Tom van Dam</span>
        <span class="block text-xs text-neutral-600">Za 3 okt · bar 07:30 – 12:00</span>
      </span>
      <span class="text-[10px] font-black uppercase text-neutral-500">Gekozen</span>
    </button>

    <button class="flex w-full items-center gap-3 rounded-md border border-[#cccccc] bg-white p-3 text-left">
      <span class="h-6 w-6 rounded-full border-2 border-[#cccccc]"></span>
      <span>
        <span class="block text-sm font-black">Fatima El Amrani</span>
        <span class="block text-xs text-neutral-600">Zo 4 okt · bar 09:00 – 13:00</span>
      </span>
    </button>

    <button class="flex w-full items-center gap-3 rounded-md border border-[#cccccc] bg-white p-3 text-left">
      <span class="h-6 w-6 rounded-full border-2 border-[#cccccc]"></span>
      <span>
        <span class="block text-sm font-black">Peter Smit</span>
        <span class="block text-xs text-neutral-600">Za 10 okt · bar 07:30 – 12:00</span>
      </span>
    </button>

    <div class="rounded-md bg-black px-3 py-2 text-xs text-white">
      Na ja van Tom is de ruil direct rond. Er komt geen open plek.
    </div>
  </main>

  <div class="shrink-0 border-t border-[#cccccc] bg-white px-3 py-2">
    <button class="h-12 w-full rounded-full bg-black text-sm font-black uppercase tracking-wide text-white">Vraag Tom om te ruilen</button>
  </div>
</body>
</html>
