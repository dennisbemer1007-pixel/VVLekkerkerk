# Blueprint: VVL Planning — productie op Render Starter
# https://render.com/docs/blueprint-spec
#
# De database staat op een vaste schijf. Een nieuwe deploy wist de planning niet.
# SEED_DEMO blijft uit: geen oefenaccounts op het loginscherm.
# ADMIN_PASSWORD staat alleen in het Render-dashboard (sync: false), niet in git.

services:
  - type: web
    name: vvl-planning-demo
    runtime: node
    plan: starter
    region: frankfurt
    # --include=dev: Vite e.d. staan in devDependencies; Render zet NODE_ENV=production
    buildCommand: npm install --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    disk:
      name: vvl-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        value: admin@vvl.local
      # Bestaande waarde in het dashboard blijft staan. Zet daar een eigen wachtwoord.
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        value: https://planning.vvlekkerkerk.nl
      - key: MAIL_SECRET
        generateValue: true
